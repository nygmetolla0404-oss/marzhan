<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Цифрлы Қазақстан — 3D әлем</title>
<style>
:root{--bg:#0b1230;--panel:rgba(14,22,56,.88);--line:rgba(120,200,255,.35);--txt:#eef6ff;--mut:#a9bde0;--acc:#33e1ff;--acc2:#ffd23f;--ok:#3ee08a;--bad:#ff6b7a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.glass{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 10px 40px rgba(0,0,0,.35)}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hud>*{pointer-events:auto}
#top{position:absolute;left:14px;top:12px;padding:10px 16px;display:flex;gap:14px;align-items:center}
#top h1{font-size:18px;letter-spacing:.3px}
#top h1 span{color:var(--acc)}
#stars{font-size:15px;color:var(--acc2);font-weight:700;white-space:nowrap}
#btns{position:absolute;right:14px;top:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.b{padding:9px 14px;border-radius:14px;background:var(--panel);border:1.5px solid var(--line);font-weight:700;font-size:14px;transition:transform .12s,background .12s}
.b:hover{transform:translateY(-2px);background:rgba(40,70,140,.95)}
.b.on{background:var(--acc);color:#06203a;border-color:#fff}
#bExit{display:none;background:linear-gradient(135deg,#ff6ba0,#ffb23f);color:#2a1030;border-color:#fff}
#bLesson{display:none}
#bGuide.talk{box-shadow:0 0 0 3px rgba(51,225,255,.5);animation:talk .8s infinite alternate}
@keyframes talk{to{box-shadow:0 0 0 7px rgba(51,225,255,.15)}}
#mini{position:absolute;left:14px;bottom:14px;padding:8px;line-height:0}
#mini canvas{width:270px;height:156px;cursor:pointer;border-radius:10px}
#hint{position:absolute;left:50%;top:68px;transform:translateX(-50%);padding:10px 18px;font-size:15px;max-width:min(600px,86vw);text-align:center;transition:opacity .5s;pointer-events:none}
#prompt{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);display:none}
#prompt button{padding:14px 26px;border-radius:999px;font-size:19px;font-weight:800;background:linear-gradient(135deg,#33e1ff,#7b6cff);color:#fff;box-shadow:0 0 0 0 rgba(51,225,255,.7);animation:pulse 1.6s infinite;border:2px solid #fff;white-space:nowrap}
#prompt kbd{background:#fff;color:#1b2a6b;border-radius:7px;padding:1px 9px;margin-right:8px;font-family:inherit}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(51,225,255,.7)}70%{box-shadow:0 0 0 22px rgba(51,225,255,0)}100%{box-shadow:0 0 0 0 rgba(51,225,255,0)}}
#panel{position:absolute;right:14px;top:66px;bottom:14px;width:min(410px,calc(100vw - 28px));padding:18px;display:none;flex-direction:column;gap:12px;overflow:auto;-webkit-user-select:text;user-select:text}
#panel .hd{display:flex;gap:12px;align-items:center}
#panel .ic{font-size:40px;line-height:1}
#panel h2{font-size:21px;line-height:1.15}
#panel .pl{color:var(--mut);font-size:13px;margin-top:3px}
#panel .x{margin-left:auto;align-self:flex-start;background:rgba(255,255,255,.1);border-radius:10px;padding:6px 10px;font-size:13px;white-space:nowrap}
.dots{display:flex;gap:6px}
.dots i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.16)}
.dots i.a{background:var(--acc)}
.card{position:relative;background:rgba(255,255,255,.07);border-radius:14px;padding:16px 16px 16px;font-size:17px;line-height:1.5;min-height:150px}
.say{background:rgba(51,225,255,.18);border:1.5px solid var(--acc);border-radius:10px;padding:5px 10px;font-size:13px;font-weight:700;margin-top:10px}
.nav{display:flex;gap:8px}
.nav button{flex:1;padding:11px;border-radius:12px;background:rgba(255,255,255,.12);font-weight:700;font-size:15px}
.nav button.p{background:var(--acc);color:#06203a}
.nav button:disabled{opacity:.3;cursor:default}
.lab{border:1.5px dashed var(--line);border-radius:14px;padding:12px}
.lab h3{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--acc2);margin-bottom:8px}
.lab button{width:100%;padding:12px;border-radius:12px;background:linear-gradient(135deg,#ffb23f,#ff6ba0);color:#2a1030;font-weight:800;font-size:16px}
.lab input[type=range]{width:100%;accent-color:var(--acc2);margin-top:6px}
.lab .res{margin-top:9px;font-size:15px;line-height:1.4;color:#fff;min-height:20px}
.q{font-size:17px;font-weight:700;line-height:1.35}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.1);font-size:16px;margin-top:8px;border:2px solid transparent}
.opt:hover{border-color:var(--acc)}
.opt.ok{background:var(--ok);color:#06301a}
.opt.no{background:var(--bad);color:#3a0810}
.fb{font-weight:800;font-size:16px;min-height:22px}
#info{position:absolute;left:50%;bottom:104px;transform:translateX(-50%) translateY(20px);width:min(520px,calc(100vw - 28px));padding:16px 18px;display:none;opacity:0;transition:opacity .25s,transform .25s;-webkit-user-select:text;user-select:text}
#info.show{opacity:1;transform:translateX(-50%) translateY(0)}
#info .ih{display:flex;align-items:center;gap:10px}
#info .ii{font-size:34px;line-height:1}
#info b{font-size:19px;flex:1;line-height:1.2}
#info .ib{background:rgba(255,255,255,.12);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700}
#info p{margin-top:9px;font-size:16px;line-height:1.5}
#info small{display:block;margin-top:6px;color:var(--mut);font-size:12px}
body.inside #mini,body.inside #bFly,body.inside #prompt{display:none!important}
body.inside #bExit{display:inline-block}
body.inside #info{left:14px;transform:none;bottom:14px;width:min(460px,calc(100vw - 28px))}
#warp{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .7s ease;z-index:20;background:radial-gradient(circle at 50% 50%,#fff 0,#bff6ff 12%,rgba(51,225,255,.85) 34%,rgba(60,40,160,.95) 70%,#050a1e 100%)}
#warp.on{opacity:1}
#warp::after{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.35) 0 2deg,transparent 2deg 9deg);animation:spin 3s linear infinite;mix-blend-mode:screen;-webkit-mask:radial-gradient(circle,transparent 8%,#000 40%);mask:radial-gradient(circle,transparent 8%,#000 40%)}
@keyframes spin{to{transform:rotate(360deg)}}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,rgba(30,60,150,.55),rgba(5,8,30,.92));z-index:10;padding:16px;overflow:auto}
.box{max-width:720px;width:100%;padding:28px;text-align:center}
.box h1{font-size:clamp(34px,6vw,58px);line-height:1.05;background:linear-gradient(90deg,#33e1ff,#fff,#ffd23f);-webkit-background-clip:text;background-clip:text;color:transparent}
.box .sub{font-size:clamp(16px,2.4vw,21px);margin-top:10px}
.box .tag{color:var(--mut);margin-top:6px;font-size:14px;letter-spacing:1px;text-transform:uppercase}
.auth{display:flex;gap:16px;align-items:center;text-align:left;margin:20px auto 0;padding:14px;border-radius:16px;background:rgba(255,255,255,.07);max-width:560px}
.auth img{width:92px;height:92px;border-radius:50%;object-fit:cover;object-position:50% 22%;border:3px solid var(--acc);flex:none}
.auth b{font-size:17px}
.auth div{font-size:13.5px;color:var(--mut);line-height:1.45}
.auth div b{color:var(--txt);display:block}
.go{margin-top:22px;padding:16px 34px;border-radius:999px;font-size:22px;font-weight:800;background:linear-gradient(135deg,#33e1ff,#7b6cff);color:#fff;border:2px solid #fff;animation:pulse 1.8s infinite}
.keys{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:13.5px;color:var(--mut);text-align:left}
.idea{margin-top:12px;font-size:14.5px;line-height:1.5;color:var(--txt);text-align:left}
#joy{position:absolute;right:26px;bottom:26px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid var(--line);display:none;touch-action:none}
#joy i{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:var(--acc)}
.conf{position:fixed;top:-40px;font-size:28px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (max-width:760px){#top h1{display:none}#mini canvas{width:170px;height:98px}#panel{top:auto;height:52vh}.keys{grid-template-columns:1fr}.auth img{width:70px;height:70px}#info{bottom:auto;top:66px}body.inside #info{bottom:auto;top:66px}}
@media (pointer:coarse){#joy{display:block}#mini{bottom:auto;top:62px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="top" class="glass"><h1>🇰🇿 <span id="tTitle"></span></h1><div id="stars"></div></div>
  <div id="btns">
    <button class="b" id="bExit"></button>
    <button class="b" id="bLesson"></button>
    <button class="b" id="bGuide"></button>
    <button class="b" id="bFly"></button>
    <button class="b" id="bAuthor"></button>
  </div>
  <div id="hint" class="glass"></div>
  <div id="mini" class="glass"><canvas id="mm" width="540" height="312"></canvas></div>
  <div id="prompt"><button id="bGo"></button></div>
  <div id="info" class="glass"><div class="ih"><span class="ii"></span><b></b><button class="ib" id="iSay">🔊</button><button class="ib" id="iX">✕</button></div><p></p><small></small></div>
  <div id="panel" class="glass"></div>
  <div id="joy"><i></i></div>
</div>

<div id="warp"></div>

<div class="ov" id="startOv">
  <div class="box glass">
    <div class="tag" id="sTag"></div>
    <h1 id="sTitle"></h1>
    <div class="sub" id="sSub"></div>
    <div class="auth"><img src="assets/teacher.jpg" alt=""><div><b id="sName"></b><span id="sRole"></span><br><span id="sSchool"></span><br><span id="sFest"></span></div></div>
    <button class="go" id="bStart"></button>
    <div class="keys"><span id="k1"></span><span id="k2"></span><span id="k3"></span><span id="k4"></span></div>
  </div>
</div>

<div class="ov" id="modal" style="display:none"><div class="box glass" id="modalBox"></div></div>

<script src="js/three.min.js"></script>
<script src="js/kz.js"></script>
<script src="js/data.js"></script>
<script src="js/photos.js"></script>
<script src="js/audio.js"></script>
<script src="js/main.js"></script>
</body>
</html>
